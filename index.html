/* ---------- REPORT ---------- */
function more(){T('Report');const L=P.slice().sort((a,b)=>tot(b)-tot(a));
 app.innerHTML=`<div class="card g3 st"><div><b>${P.length}</b><small>Parties</small></div><div><b>${f0(Math.round(P.reduce((a,p)=>a+tot(p),0)))}</b><small>Total points</small></div><div><b>Rs ${f0(Math.round(P.reduce((a,p)=>a+p.bills.reduce((x,b)=>x+bamt(b),0),0)))}</b><small>Total amount</small></div></div>
 <h3>Leaderboard</h3><div class="card">${L.length?L.map((p,k)=>`<div class="it" style="cursor:pointer" data-a="party" data-id="${p.id}"><div><b>${k+1}. ${esc(p.name)}</b><small>${esc(p.loc)} &middot; ${p.tour} &middot; ${Math.min(100,tot(p)/TOURS[p.tour]*100).toFixed(0)}%</small></div><b>${f(tot(p))}</b></div>`).join(''):'<p class="m">No data yet.</p>'}</div>
 <div class="row"><button data-a="csv">&#11015; Download CSV</button><button data-a="admin2">&#128737; Admin dashboard</button></div>${credit()}`}
/* ---------- CSV / download ---------- */
function download(name,text,type){const b=new Blob([text],{type:type||'text/plain'}),u=URL.createObjectURL(b),a=document.createElement('a');a.href=u;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(u),1500)}
function myCSV(){let r=[['Party','Location','Phone','Tour','Points','Target','Qualified','Bill date','Items','Bill amount','Bill points']];P.forEach(p=>{const T2=TOURS[p.tour];if(!p.bills.length)r.push([p.name,p.loc,p.phone,p.tour,tot(p).toFixed(2),T2,tot(p)>=T2?'Yes':'No','','','','']);p.bills.forEach(b=>r.push([p.name,p.loc,p.phone,p.tour,tot(p).toFixed(2),T2,tot(p)>=T2?'Yes':'No',b.d,b.items.length,bamt(b).toFixed(2),bpts(b).toFixed(2)]))});return r.map(x=>x.map(c=>`"${String(c==null?'':c).replace(/"/g,'""')}"`).join(',')).join('\n')}
/* ---------- CLIPBOARD ---------- */
function cp(t){const m=$('bm');try{navigator.clipboard.writeText(t).then(()=>{m&&(m.textContent='Copied.');toast('Copied')},()=>fb(t))}catch(e){fb(t)}}
function fb(t){const x=$('bx');if(x){x.value=t;x.select();}try{document.execCommand('copy');$('bm')&&($('bm').textContent='Copied.');toast('Copied')}catch(e){$('bm')&&($('bm').textContent='Select the text and copy it manually.')}}
/* ========================================================
   FIREBASE LIVE SYNC + ADMIN
   ======================================================== */
const DEVICE_ID=(()=>{let d=localStorage.getItem('yp_dev');if(!d){d=uid()+uid();localStorage.setItem('yp_dev',d)}return d})();
let fbApp=null,fbDB=null,fbReady=false,fbFns=null,lastPush=0,cloudSkip=false;
async function initCloud(){if(!FB_CONFIG.apiKey||fbReady)return;try{
 const A=await import('https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js');
 const F=await import('https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js');
 const AU=await import('https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js');
 fbApp=A.initializeApp(FB_CONFIG);fbDB=F.getFirestore(fbApp);fbFns=F;
 try{const au=AU.getAuth(fbApp);await AU.signInAnonymously(au)}catch(e){}
 fbReady=true;
 // live listener on my own doc (admin edits flow back)
 F.onSnapshot(F.doc(fbDB,'reps',DEVICE_ID),s=>{const d=s.data();if(!d||d.writer===DEVICE_ID)return;if((d.ts||0)>lastPush){try{P=JSON.parse(d.data||'[]');localStorage.setItem('yp_v3',JSON.stringify(P));render();toast('Updated by admin')}catch(e){}}});
 await pushCloud(true);
 updSyncBadges();
}catch(e){fbReady=false;updSyncBadges()}}
function badge(){if(!FB_CONFIG.apiKey)return{c:'off',t:'Local only'};if(fbReady)return{c:'on',t:'● Live'};return{c:'',t:'Cloud…'}}
function updSyncBadges(){const h=$('hsyn');if(h){const b=badge();h.className='synced '+b.c;h.textContent=b.t}if($('synst'))syncStatus()}
let pushT=null;
function pushCloud(now){if(!fbReady||!FB_CONFIG.apiKey)return Promise.resolve();clearTimeout(pushT);return new Promise(res=>{const run=async()=>{try{lastPush=Date.now();await fbFns.setDoc(fbFns.doc(fbDB,'reps',DEVICE_ID),{name:ME,phone:MEPH,device:DEVICE_ID,writer:DEVICE_ID,ts:lastPush,data:JSON.stringify(P)});}catch(e){}res()};now?run():pushT=setTimeout(run,900)})}
async function pullMine(){if(!fbReady)return;try{const s=await fbFns.getDoc(fbFns.doc(fbDB,'reps',DEVICE_ID));const d=s.data();if(d&&d.writer!==DEVICE_ID&&(d.ts||0)>lastPush){P=JSON.parse(d.data||'[]');localStorage.setItem('yp_v3',JSON.stringify(P))}}catch(e){}}
/* ---------- ADMIN ---------- */
let ADM=[];
function askAdmin(){if(localStorage.getItem('yp_adm')==='1'){go('admin');return}
 sheet2(`<b>&#128737; Admin login</b><small>Owner access only.</small><label for="auser">Username</label><input id="auser" autocomplete="off" placeholder="Username"><label for="apin">Password</label><input id="apin" type="password" placeholder="Password"><button class="p full" id="ago">Open dashboard</button><small id="aerr" style="color:var(--dg);margin-top:6px"></small>`);
 const tryLogin=()=>{if($('auser').value.trim().toLowerCase()===ADMIN_USER.toLowerCase()&&$('apin').value===ADMIN_PIN){localStorage.setItem('yp_adm','1');shut2();go('admin')}else $('aerr').textContent='Wrong username or password.'};
 $('ago').onclick=tryLogin;$('apin').onkeydown=e=>{if(e.key==='Enter')tryLogin()}}
function admTop(extra){return `<div class="row" style="margin-top:10px"><button data-adm="refresh">&#8635; Refresh</button>${extra||''}<button class="d" data-adm="logout">Log out</button></div>`}
function fbStepsCard(){return `<div class="card"><b>Turn on live cloud &mdash; free, about 3 minutes</b>
 <ol style="margin:8px 0 0;padding-left:20px;font-size:13px;line-height:1.75">
 <li>Open <a href="https://console.firebase.google.com" target="_blank" rel="noopener">console.firebase.google.com</a> &rarr; <b>Add project</b> &rarr; name it &rarr; Create.</li>
 <li>Click the web icon <b>&lt;/&gt;</b> &rarr; register app &rarr; copy the <b>firebaseConfig</b> values.</li>
 <li><b>Build &rarr; Firestore Database</b> &rarr; Create &rarr; Production mode &rarr; Enable.</li>
 <li>Firestore <b>Rules</b> tab &rarr; paste the rules from README.md &rarr; Publish.</li>
 <li><b>Build &rarr; Authentication</b> &rarr; Get started &rarr; enable <b>Anonymous</b> &rarr; Save.</li>
 <li>Paste the 4 values into <b>FB_CONFIG</b> at the top of index.html &rarr; re-deploy.</li>
 </ol><small style="margin-top:8px">Exact rules are in <b>README.md</b>. Easiest: do steps 1&ndash;5, then send your config values to me and I'll put them in and re-send the zip.</small></div>`}
async function admin(){T('Admin dashboard');
 if(!FB_CONFIG.apiKey){app.innerHTML=`<div class="card"><div class="hd"><b>&#128737; Admin dashboard</b><span class="synced off">Local only</span></div><small style="margin-top:4px">Showing <b>this phone only</b>. Turn on cloud below to see everyone's phones live.</small>${admTop()}</div>${fbStepsCard()}${admRender([{name:ME||'This device',phone:MEPH,device:DEVICE_ID,data:JSON.stringify(P),ts:Date.now()}])}`;return}
 if(!fbReady)await initCloud();
 app.innerHTML=`<div class="card"><div class="hd"><b>&#128737; Everyone's data</b><span class="synced ${fbReady?'on':''}">${fbReady?'&#9679; Live':'Connecting&hellip;'}</span></div><small style="margin-top:4px">Live from all phones. Tap a person to view, edit, or download.</small>${admTop()}</div><div id="admw"><p class="m" style="text-align:center;margin:24px">Loading&hellip;</p></div>`;
 try{fbFns.onSnapshot(fbFns.collection(fbDB,'reps'),snap=>{ADM=[];snap.forEach(d=>ADM.push(d.data()));ADM.sort((a,b)=>reps_pts(b)-reps_pts(a));if($('admw')){$('admw').innerHTML=admBody();bindAdm()}})}catch(e){if($('admw'))$('admw').innerHTML='<div class="card d">Could not load cloud data. Check your internet.</div>'}}
function reps_parse(r){try{return JSON.parse(r.data||'[]')}catch(e){return[]}}
function reps_pts(r){return reps_parse(r).reduce((a,p)=>a+p.bills.reduce((x,b)=>x+b.items.reduce((y,i)=>y+(i.cs*i.pt+i.pc*i.pt/i.q),0),0),0)}
function admBody(){const total=ADM.reduce((a,r)=>a+reps_pts(r),0),parties=ADM.reduce((a,r)=>a+reps_parse(r).length,0);
 return `<div class="card g3 st"><div><b>${ADM.length}</b><small>Users</small></div><div><b>${f0(parties)}</b><small>Parties</small></div><div><b>${f0(Math.round(total))}</b><small>Total points</small></div></div>
 <div class="row"><button data-adm="allcsv">&#11015; Download all (CSV)</button><button data-adm="alljson">&#11015; Backup all (JSON)</button></div>
 <h3>Users (${ADM.length})</h3>${ADM.length?ADM.map(r=>{const pp=reps_parse(r);return `<div class="card pcard" data-adm="open" data-id="${esc(r.device)}"><div class="av">${esc((r.name||'?')[0].toUpperCase())}</div><div class="fl"><div class="hd"><b>${esc(r.name||'Unknown')}</b><span class="tag">${f0(Math.round(reps_pts(r)))} pts</span></div><small>${pp.length} parties &middot; ${esc(r.phone||'no number')}${r.ts?' &middot; '+new Date(r.ts).toLocaleDateString('en-IN'):''}</small></div></div>`}).join(''):'<p class="m" style="text-align:center;margin:20px">No data yet. Ask your team to open the tool and enter their name.</p>'}`}
function admRender(list){ADM=list;return admBody()}
function bindAdm(){/* clicks handled by #sh2 + app delegation */}
function admClick(a,id){
 if(a==='allcsv'){let r=[['User','UserPhone','Party','Location','PartyPhone','Tour','Points','Target','Qualified','Bills']];ADM.forEach(u=>{reps_parse(u).forEach(p=>{const tp=p.bills.reduce((x,b)=>x+b.items.reduce((y,i)=>y+(i.cs*i.pt+i.pc*i.pt/i.q),0),0);r.push([u.name,u.phone,p.name,p.loc,p.phone,p.tour,tp.toFixed(2),TOURS[p.tour],tp>=TOURS[p.tour]?'Yes':'No',p.bills.length])})});download('shape-all-users.csv',r.map(x=>x.map(c=>`"${String(c==null?'':c).replace(/"/g,'""')}"`).join(',')).join('\n'),'text/csv');toast('Downloaded')}
 else if(a==='alljson'){download('shape-all-users.json',JSON.stringify(ADM,null,2),'application/json');toast('Downloaded')}
 else if(a==='open'){admOpen(id)}
 else if(a==='ucsv'){const u=ADM.find(x=>x.device===id);if(u){download('shape-'+(u.name||'user').replace(/\W+/g,'-')+'.csv',userCSV(u),'text/csv');toast('Downloaded')}}
 else if(a==='save'){admSave(id)}
 else if(a==='logout'){localStorage.removeItem('yp_adm');toast('Logged out');go('home')}
 else if(a==='refresh'){go('admin')}
 else if(a==='back'){go('admin')}}
function userCSV(u){let r=[['Party','Location','Phone','Tour','Points','Bill date','Items','Bill amount','Bill points']];reps_parse(u).forEach(p=>{const tp=p.bills.reduce((x,b)=>x+b.items.reduce((y,i)=>y+(i.cs*i.pt+i.pc*i.pt/i.q),0),0);p.bills.forEach(b=>{const ba=b.items.reduce((x,i)=>x+(i.cs*i.q+i.pc)*i.dp,0),bp=b.items.reduce((x,i)=>x+(i.cs*i.pt+i.pc*i.pt/i.q),0);r.push([p.name,p.loc,p.phone,p.tour,tp.toFixed(2),b.d,b.items.length,ba.toFixed(2),bp.toFixed(2)])})});return r.map(x=>x.map(c=>`"${String(c==null?'':c).replace(/"/g,'""')}"`).join(',')).join('\n')}
function admOpen(id){const u=ADM.find(x=>x.device===id);if(!u)return go('admin');T('Admin · '+(u.name||'User'));
 const pp=reps_parse(u);
 app.innerHTML=`<div class="card"><button class="btn" data-adm="back" style="margin-bottom:8px">&larr; All users</button><div class="pcard" style="cursor:default"><div class="av">${esc((u.name||'?')[0].toUpperCase())}</div><div class="fl"><b style="font-size:17px">${esc(u.name||'Unknown')}</b><small>${esc(u.phone||'')} &middot; ${pp.length} parties &middot; ${f0(Math.round(reps_pts(u)))} pts</small></div></div>
 ${u.phone?`<div class="row" style="margin-top:8px"><a class="chip cl" href="${tel(u.phone)}">&#128222; Call</a><a class="chip wa" target="_blank" rel="noopener" href="https://wa.me/${ph(u.phone)}">&#128172; Chat</a></div>`:''}
 <div class="row"><button class="p" data-adm="ucsv" data-id="${esc(id)}">&#11015; Download CSV</button></div></div>
 <div class="card"><table class="tbl"><tr><th>Party</th><th>Tour</th><th class="n">Points</th><th class="n">Bills</th></tr>${pp.length?pp.map(p=>{const tp=p.bills.reduce((x,b)=>x+b.items.reduce((y,i)=>y+(i.cs*i.pt+i.pc*i.pt/i.q),0),0);return `<tr><td>${esc(p.name)}<br><small>${esc(p.loc||'')}</small></td><td>${p.tour}</td><td class="n">${f0(Math.round(tp))}</td><td class="n">${p.bills.length}</td></tr>`}).join(''):'<tr><td colspan="4" class="m">No parties.</td></tr>'}</table></div>
 <h3>Edit this user's data</h3><div class="card"><small>Advanced: edit the raw data (JSON) and save it back to their phone. Change carefully.</small><textarea id="aedit" rows="8" style="margin-top:8px;font-family:monospace;font-size:12px">${esc(JSON.stringify(pp,null,2))}</textarea><button class="p full" data-adm="save" data-id="${esc(id)}">Save changes to cloud</button><small id="asv" style="margin-top:6px"></small></div>`}
async function admSave(id){if(!fbReady){$('asv').textContent='Enable cloud sync first (add Firebase keys - see README).';$('asv').style.color='var(--dg)';return}
 let x;try{x=JSON.parse($('aedit').value);if(!Array.isArray(x))throw 0}catch(e){$('asv').textContent='Invalid JSON. Not saved.';$('asv').style.color='var(--dg)';return}
 try{await fbFns.setDoc(fbFns.doc(fbDB,'reps',id),{writer:'admin',ts:Date.now(),data:JSON.stringify(x)},{merge:true});$('asv').textContent='Saved. It will update on their phone.';$('asv').style.color='var(--wa)';toast('Saved to cloud')}catch(e){$('asv').textContent='Could not save.';$('asv').style.color='var(--dg)'}}
/* ========================================================
   CLICK ROUTER
   ======================================================== */
app.onclick=e=>{const ad=e.target.closest('[data-adm]');if(ad){admClick(ad.dataset.adm,ad.dataset.id);return}
 const t=e.target.closest('[data-a]');if(!t)return;const a=t.dataset.a,id=t.dataset.id;
 if(a==='party')go('party',{pid:id});
 else if(a==='nb'){D.pid=id;D.items=[];go('bill')}
 else if(a==='np')go('pform',{});
 else if(a==='bill')go('view',{pid:V.pid,bid:id});
 else if(a==='edit')go('pform',{pid:id});
 else if(a==='tel'){const p=gp(id);phoneSheet(p.name,p.phone)}
 else if(a==='telown'){phoneSheet(OWNER.name,OWNER.phone)}
 else if(a==='xhint'){localStorage.setItem('yp_hint','0');home()}
 else if(a==='csv'){download('shape-'+(ME||'my').replace(/\W+/g,'-')+'.csv',myCSV(),'text/csv');toast('Downloaded')}
 else if(a==='admin2')askAdmin();
 else if(a==='pick'){S=DATA[+id];$('sn').textContent=S[2];$('si').textContent='1 CS = '+S[3]+' pcs · '+f(S[4])+' pts · DP Rs '+f(S[5])+' per pc';$('cs').value='';$('pc').value='';sprev();$('sh').hidden=false;$('bg').hidden=false;$('cs').focus()}
 else if(a==='rm'){D.items.splice(+id,1);cart()}
 else if(a==='sv'){if(!D.pid){$('bm').textContent='Select a party.';return}if(!D.items.length){$('bm').textContent='Add at least one item.';return}
  const p=gp(D.pid),b={id:uid(),d:D.d||today,items:D.items};p.bills.push(b);D={pid:'',d:today,items:[]};save();go('view',{pid:p.id,bid:b.id})}
 else if(a==='pf'){const n=$('fn').value.trim();if(!n){$('fm').textContent='Enter the party name.';return}
  const v={name:n,loc:$('fl').value.trim(),phone:$('fp').value.trim(),tour:$('ft').value};
  if(V.pid){Object.assign(gp(V.pid),v);save();go('party',{pid:V.pid})}else{const p=Object.assign({id:uid(),bills:[]},v);P.push(p);save();go('party',{pid:p.id})}}
 else if(a==='dp'){if(armed!=='dp'){armed='dp';t.textContent='Tap again to delete';return}P=P.filter(p=>p.id!==V.pid);save();go('home')}
 else if(a==='db'){if(armed!=='db'){armed='db';t.textContent='Tap again to delete bill';return}const p=gp(V.pid);p.bills=p.bills.filter(b=>b.id!==V.bid);save();go('party',{pid:p.id})}
 else if(a==='bc'){const s=JSON.stringify(P);$('bx').value=s;cp(s)}
 else if(a==='br'){try{const x=JSON.parse($('bx').value);if(!Array.isArray(x))throw 0;P=x;save();$('bm').textContent='Restored '+x.length+' parties.';toast('Restored')}catch(er){$('bm').textContent='Invalid backup text.'}}};
/* ---------- boot ---------- */
render();
if(FB_CONFIG.apiKey&&ME)initCloud();
</script><script>if("serviceWorker" in navigator&&location.protocol.indexOf("http")===0){navigator.serviceWorker.register("sw.js").catch(function(){})}</script></body></html>
