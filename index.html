 <div class="row"><button class="p" data-a="nb" data-id="${p.id}">+ New bill</button><a class="btn g" target="_blank" rel="noopener" href="${wa(p.phone,st(p))}">WhatsApp statement</a></div>
 <div class="row"><button data-a="edit" data-id="${p.id}">Edit party</button><button class="d" data-a="dp" data-id="${p.id}">${armed==='dp'?'Tap again to delete':'Delete party'}</button></div></div>
 <h3>Bills (${B.length})</h3>${B.length?B.map(b=>`<div class="card brow" data-a="bill" data-id="${b.id}"><div class="hd"><b>${b.d}</b><b>Rs ${f(bamt(b))}</b></div><small>${b.items.length} item${b.items.length>1?'s':''} · ${f(bpts(b))} pts</small></div>`).join(''):'<p class="m">No bills yet. Tap New bill.</p>'}${credit}`}
function view(){const p=gp(V.pid),b=p&&p.bills.find(x=>x.id===V.bid);if(!b)return go('home');T('Bill · '+b.d);
 app.innerHTML=`<div class="card"><b>${esc(p.name)}</b><small>${esc(p.loc)}</small></div><div class="card">${b.items.map(i=>`<div class="it"><div><b>${esc(i.n)}</b><small>${ql(i)} · ${f(pts(i))} pts</small></div><b>Rs ${f(amt(i))}</b></div>`).join('')}
 <div class="tot"><span>Bill amount</span><span>Rs ${f(bamt(b))}</span></div><div class="tot"><span>Bill points</span><span>${f(bpts(b))}</span></div><small style="margin-top:6px">Amount at DP, excluding GST</small></div>
 <div class="card"><small>Tour progress</small>${bar(p)}</div>
 <a class="btn g full" target="_blank" rel="noopener" href="${wa(p.phone,bt(p,b))}">Send bill on WhatsApp</a>
 <button class="d full" data-a="db">${armed==='db'?'Tap again to delete bill':'Delete bill'}</button>${credit}`}
function bill(){T('New bill');
 if(!P.length){app.innerHTML='<div class="card"><p class="m">Add a party first.</p><button class="p full" data-a="np">Add party</button></div>';return}
 app.innerHTML=`<div class="card"><label for="bp" style="margin-top:0">Party</label><select id="bp"><option value="">Select party</option>${P.map(p=>`<option value="${p.id}" ${p.id===D.pid?'selected':''}>${esc(p.name)}${p.loc?' – '+esc(p.loc):''}</option>`).join('')}</select><label for="bd">Bill date</label><input id="bd" type="date" value="${D.d}"></div>
 <div class="card"><input id="q" placeholder="Search product by name or code" autocomplete="off"><div id="res"></div></div>
 <div class="card"><b>Items</b><div id="cart"></div><div id="tots"></div><button class="p full" data-a="sv">Save bill</button><small id="bm" style="color:var(--dg);margin-top:8px"></small></div>`;
 $('bp').onchange=e=>{D.pid=e.target.value};$('bd').onchange=e=>{D.d=e.target.value||today};$('q').oninput=srch;cart()}
function srch(){const q=$('q').value.toLowerCase().split(/\s+/).filter(Boolean);if(!q.length){$('res').innerHTML='';return}
 let h='',c=0;for(let i=0;i<DATA.length&&c<40;i++)if(q.every(t=>IDX[i].includes(t))){c++;const d=DATA[i];
  h+=`<div class="r" data-a="pick" data-id="${i}"><b>${esc(d[2])}</b><small>${d[0]} · ${esc(d[1])} · 1 CS = ${d[3]} pcs · ${f(d[4])} pts · DP ${f(d[5])}</small></div>`}
 $('res').innerHTML=h||'<p class="m">No matching product.</p>'}
function cart(){const I=D.items;
 $('cart').innerHTML=I.length?I.map((i,k)=>`<div class="it"><div><b>${esc(i.n)}</b><small>${ql(i)} · ${f(pts(i))} pts</small></div><div style="text-align:right"><b>Rs ${f(amt(i))}</b><br><button class="d" style="padding:2px 8px;margin-top:4px" data-a="rm" data-id="${k}" aria-label="Remove">✕</button></div></div>`).join(''):'<p class="m">Search and tap a product to add it.</p>';
 $('tots').innerHTML=I.length?`<div class="tot"><span>Total amount</span><span>Rs ${f(I.reduce((a,i)=>a+amt(i),0))}</span></div><div class="tot"><span>Total points</span><span>${f(I.reduce((a,i)=>a+pts(i),0))}</span></div>`:''}
function sprev(){if(!S)return;const i={cs:+$('cs').value||0,pc:+$('pc').value||0,q:S[3],pt:S[4],dp:S[5]};$('sa').textContent='Rs '+f(amt(i));$('sp').textContent=f(pts(i))}
function shut(){$('sh').hidden=true;$('bg').hidden=true}
$('bg').onclick=shut;$('cs').oninput=sprev;$('pc').oninput=sprev;
$('sadd').onclick=()=>{const cs=+$('cs').value||0,pc=+$('pc').value||0;if(!cs&&!pc)return;
 D.items.push({c:S[1],n:S[2],q:S[3],pt:S[4],dp:S[5],cs,pc});shut();$('q').value='';$('res').innerHTML='';cart()};
function more(){T('Report');const L=P.slice().sort((a,b)=>tot(b)-tot(a));
 app.innerHTML=`<h3>Leaderboard</h3><div class="card">${L.length?L.map((p,k)=>`<div class="it" style="cursor:pointer" data-a="party" data-id="${p.id}"><div><b>${k+1}. ${esc(p.name)}</b><small>${esc(p.loc)} · ${p.tour} · ${Math.min(100,tot(p)/TOURS[p.tour]*100).toFixed(0)}%</small></div><b>${f(tot(p))}</b></div>`).join(''):'<p class="m">No data yet.</p>'}</div>
 <h3>Backup</h3><div class="card"><small>Data is saved on this device. Copy a backup regularly and keep it safe (for example in WhatsApp saved messages).</small>
 <textarea id="bx" rows="4" placeholder="Backup text appears here, or paste a backup to restore" style="margin-top:8px"></textarea>
 <div class="row"><button data-a="bc">Copy backup</button><button data-a="br">Restore</button></div><small id="bm" style="margin-top:6px"></small></div>${credit}`}
function cp(t){const m=$('bm');try{navigator.clipboard.writeText(t).then(()=>m.textContent='Copied.',()=>fb(t))}catch(e){fb(t)}}
function fb(t){const x=$('bx');x.value=t;x.select();try{document.execCommand('copy');$('bm').textContent='Copied.'}catch(e){$('bm').textContent='Select the text and copy it manually.'}}
app.onclick=e=>{const t=e.target.closest('[data-a]');if(!t)return;const a=t.dataset.a,id=t.dataset.id;
 if(a==='party')go('party',{pid:id});
 else if(a==='nb'){D.pid=id;go('bill')}
 else if(a==='np')go('pform',{});
 else if(a==='bill')go('view',{pid:V.pid,bid:id});
 else if(a==='edit')go('pform',{pid:id});
 else if(a==='pick'){S=DATA[+id];$('sn').textContent=S[2];$('si').textContent='1 CS = '+S[3]+' pcs · '+f(S[4])+' pts · DP Rs '+f(S[5])+' per pc';$('cs').value='';$('pc').value='';sprev();$('sh').hidden=false;$('bg').hidden=false;$('cs').focus()}
 else if(a==='rm'){D.items.splice(+id,1);cart()}
 else if(a==='sv'){if(!D.pid){$('bm').textContent='Select a party.';return}if(!D.items.length){$('bm').textContent='Add at least one item.';return}
  const p=gp(D.pid),b={id:uid(),d:D.d||today,items:D.items};p.bills.push(b);D={pid:'',d:today,items:[]};save();go('view',{pid:p.id,bid:b.id})}
 else if(a==='pf'){const n=$('fn').value.trim();if(!n){$('fm').textContent='Enter the party name.';return}
  const v={name:n,loc:$('fl').value.trim(),phone:$('fp').value.trim(),tour:$('ft').value};
  if(V.pid){Object.assign(gp(V.pid),v);save();go('party',{pid:V.pid})}else{const p=Object.assign({id:uid(),bills:[]},v);P.push(p);save();go('party',{pid:p.id})}}
 else if(a==='dp'){if(armed!=='dp'){armed='dp';t.textContent='Tap again to delete';return}P=P.filter(p=>p.id!==V.pid);save();go('home')}
 else if(a==='db'){if(armed!=='db'){armed='db';t.textContent='Tap again to delete bill';return}const p=gp(V.pid);p.bills=p.bills.filter(b=>b.id!==V.bid);save();go('party',{pid:p.id})}
 else if(a==='bc'){const s=JSON.stringify(P);$('bx').value=s;cp(s)}
 else if(a==='br'){try{const x=JSON.parse($('bx').value);if(!Array.isArray(x))throw 0;P=x;save();$('bm').textContent='Restored '+x.length+' parties.'}catch(er){$('bm').textContent='Invalid backup text.'}}};
render();
</script><script>if("serviceWorker" in navigator&&location.protocol.indexOf("http")===0){navigator.serviceWorker.register("sw.js").catch(function(){})}</script></body></html>
